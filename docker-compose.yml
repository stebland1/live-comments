services:
  db:
    image: postgres:18-alpine
    container_name: lcom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LCOM_PG_ROOT_USER}
      POSTGRES_PASSWORD: ${LCOM_PG_ROOT_PASSWORD}
      POSTGRES_DB: ${LCOM_PG_DB}
      POSTGRES_APP_USER: ${LCOM_PG_APP_USER}
      POSTGRES_APP_PASSWORD: ${LCOM_PG_APP_PASSWORD}
    ports:
      - "${LCOM_PG_PORT}:5432"
    volumes:
      - ./db-init/:/docker-entrypoint-initdb.d/
      - "db-data:/var/lib/postgresql"
  redis:
    image: redis:7-alpine
    container_name: lcom-redis
    restart: unless-stopped
    ports:
      - "${LCOM_REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --loglevel warning
      

volumes:
  db-data:
  redis-data:
